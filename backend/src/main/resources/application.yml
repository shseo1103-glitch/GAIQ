server:
  port: 8089

spring:
  application:
    name: gaiq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/gaiq
    username: ${DB_USERNAME:gaiq}
    password: ${DB_PASSWORD:gaiq}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; JPA only validates entity <-> table mapping at startup.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT (jjwt 0.12.x). Secret MUST be overridden via environment variable in every
# real deployment; the default below is a local-dev-only placeholder.
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_CHANGE_ME_LOCAL_DEV_ONLY_GAIQ}
  access-token-validity-ms: 1800000    # 30 minutes
  refresh-token-validity-ms: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info
